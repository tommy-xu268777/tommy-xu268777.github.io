<section class="visitor-map" aria-label="Visitor map">
  <h2 class="visitor-map__title">Visitors</h2>
  <!-- Globe size follows the width of .visitor-map__globe: globe.js reads
       $("#mmvst_globe").parent().width() when the src carries no w parameter. -->
  <div class="visitor-map__globe">
    <script
      type="text/javascript"
      id="mmvst_globe"
      src="https://mapmyvisitors.com/globe.js?d=9Tr2jW2MEugG7FCYRUKo046lKcG0y6sdFWVImJZrz_k">
    </script>
  </div>
</section>
